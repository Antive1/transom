name: release

# Builds the release from the tagged source on a GitHub-hosted runner, signs the executables and then the installer through
# SignPath (free code signing for open source: SignPath.io, certificate by SignPath Foundation; see CODE_SIGNING_POLICY.md),
# and publishes them as a GitHub release.
#
# Signing runs only when the repository variable SIGNPATH_ORGANIZATION_ID is set (and the secret SIGNPATH_API_TOKEN exists).
# Without it the workflow still builds and publishes, unsigned. Each signing request has to be approved by a person in SignPath.
#
# Repository variables (Settings > Secrets and variables > Actions > Variables):
#   SIGNPATH_ORGANIZATION_ID            required for signing
#   SIGNPATH_PROJECT_SLUG               default: transom
#   SIGNPATH_SIGNING_POLICY_SLUG        default: release-signing
#   SIGNPATH_BINARIES_CONFIG_SLUG       default: binaries   (.signpath/artifact-configurations/binaries.xml)
#   SIGNPATH_INSTALLER_CONFIG_SLUG      default: installer  (.signpath/artifact-configurations/installer.xml)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  SIGNING: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}

defaults:
  run:
    shell: bash

jobs:
  release:
    name: build, sign, publish
    runs-on: windows-2025
    timeout-minutes: 120
    permissions:
      contents: write # create the release
      actions: read # SignPath reads the uploaded artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install --profile minimal --no-self-update
          want=$(sed -nE 's/^channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml | tr -d '\r')
          test -n "$want"
          v=$(rustc -V); echo "$v"; grep -qF "rustc $want " <<<"$v"
      - name: version
        id: version
        run: |
          version=$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' Cargo.toml | head -1 | tr -d '\r')
          # the version ends up in file names, the release title and scripts: only plain semver characters
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::unexpected version format in Cargo.toml"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"; exit 1
          fi
      - name: release notes from CHANGELOG.md
        # the section "## [<version>]" goes to the top of the release body (the bar shows it when it offers the update);
        # a tag without its section fails here, before anything is built
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            { sub(/\r$/, "") }
            /^## / { if (on) exit; if (index($0, "## [" v "]") == 1) { on = 1; next } }
            on { print }
          ' CHANGELOG.md > changelog-section.md
          if ! grep -qE '^[-*] ' changelog-section.md; then
            msg="CHANGELOG.md has no '## [$VERSION]' section with entries - add it before tagging"
            if [[ "$GITHUB_REF_TYPE" == tag ]]; then echo "::error::$msg"; exit 1; fi
            echo "::warning::$msg"
          fi
          { cat changelog-section.md; echo; echo '---'; echo; cat .github/release-notes.md; } > release-body.md
          cat release-body.md
      - run: cargo build --workspace --release --locked
      - name: stage binaries
        run: |
          mkdir -p unsigned
          cp target/release/transom-app.exe target/release/transom-settings.exe target/release/transom-statusline.exe unsigned/

      - name: upload unsigned binaries
        id: upload-binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: transom-binaries-unsigned
          path: unsigned/
          if-no-files-found: error
      - name: sign binaries (SignPath)
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'transom' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_BINARIES_CONFIG_SLUG || 'binaries' }}
          github-artifact-id: ${{ steps.upload-binaries.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          parameters: |
            version: ${{ toJSON(steps.version.outputs.version) }}
          output-artifact-directory: bin
      - name: unsigned binaries (signing not configured)
        if: env.SIGNING != 'true'
        run: cp -r unsigned bin

      - name: install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: build installer
        shell: pwsh
        run: ./tools/build-installer.ps1 -SkipBuild -BinDir bin -NoZip
      - name: upload unsigned installer
        id: upload-installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: transom-installer-unsigned
          path: dist/transom-setup-*.exe
          if-no-files-found: error
      - name: sign installer (SignPath)
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'transom' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_CONFIG_SLUG || 'installer' }}
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          parameters: |
            version: ${{ toJSON(steps.version.outputs.version) }}
          output-artifact-directory: setup
      - name: unsigned installer (signing not configured)
        if: env.SIGNING != 'true'
        run: mkdir -p setup && cp dist/transom-setup-*.exe setup/

      - name: assemble release files
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # via env, never interpolated into the script text
          $v = $env:VERSION
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item setup/transom-setup-*.exe out/
          Compress-Archive -Path bin/transom-app.exe, bin/transom-settings.exe, bin/transom-statusline.exe, LICENSE -DestinationPath "out/transom-$v-x64-portable.zip"
          Get-ChildItem out | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content out/SHA256SUMS.txt
          Get-Content out/SHA256SUMS.txt
          Get-AuthenticodeSignature out/*.exe, bin/*.exe | Format-Table Status, StatusMessage, Path -AutoSize | Out-String -Width 200
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: transom-${{ steps.version.outputs.version }}
          path: out/
      - name: publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
            gh release edit "$TAG" --notes-file release-body.md
          else
            gh release create "$TAG" out/* --prerelease --title "transom $VERSION" --notes-file release-body.md
          fi
