[package]
name = "transom-sound"
description = "transom UI sounds: a short generated click after a deliberate click, own WASAPI session with its own volume"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
transom-config = { path = "../transom-config" }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Threading",
  "Win32_System_Variant",
] }

# Len pre zivy test (example): citanie hlavnej hlasitosti a spicky. Vyrobny kod tieto rozhrania nema ani povolene.
[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = ["Win32_Media_Audio_Endpoints"] }

[lints]
workspace = true
