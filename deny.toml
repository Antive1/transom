# cargo-deny: licenses, sources, banned/duplicate crates, advisories. The project is MIT.
[advisories]
yanked = "deny"

[graph]
targets = [{ triple = "x86_64-pc-windows-msvc" }]

[licenses]
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true # path dependencies between our own crates (publish = false)

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
