[workspace]
resolver = "2"
members = ["crates/transom-core", "crates/transom-config", "crates/transom-i18n", "crates/transom-platform", "crates/transom-render", "crates/transom-media", "crates/transom-usage", "crates/transom-statusline", "crates/transom-sound", "crates/transom-audio", "crates/transom-mixer", "crates/transom-peripherals", "crates/transom-tools", "crates/transom-launcher", "crates/transom-settings", "crates/transom-app"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
rust-version = "1.100"
publish = false

[workspace.dependencies]
windows = "0.62.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
